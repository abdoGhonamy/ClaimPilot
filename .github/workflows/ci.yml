name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore ClaimPilot.slnx

      - name: Build (Release)
        run: dotnet build ClaimPilot.slnx -c Release --no-restore

      - name: Test (unit, no external services)
        run: dotnet test tests/ClaimPilot.Tests/ClaimPilot.Tests.csproj -c Release --no-build

  compose-validate:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config -q

  security-scan:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked history for likely secrets
        run: |
          ! git log --all -p | grep -E '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH) PRIVATE KEY-----)'
      - name: Audit NuGet dependencies
        run: dotnet list ClaimPilot.slnx package --vulnerable --include-transitive
